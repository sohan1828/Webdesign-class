<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midnight Mug | Login</title>
  <link rel="stylesheet" href="coffee.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <img src="1.png" alt="Midnight Mug logo" class="logo">
        <span class="brand-name">MIDNIGHT MUG</span>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>

      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="Shop.html">Shop</a></li>
          <li><a href="index.html#about">About Us</a></li>
        </ul>
      </nav>

      <div class="nav-right"></div>
    </div>
  </header>

  <section class="login-wrap">
    <h2>Login</h2>
    <form class="login-form" action="#" method="post">
      <label for="uname">Username</label>
      <input type="text" id="uname" placeholder="Enter Username" name="uname" required>

      <label for="psw">Password</label>
      <input type="password" id="psw" placeholder="Enter Password" name="psw" required>

      <button type="submit">Login</button>

      <label class="remember">
        <input type="checkbox" checked name="remember"> Remember me
      </label>

      <a href="#" class="forgot">Forgot password?</a>
    </form>
  </section>

  <footer>
    <h5>Contact Us</h5>
    <p>midnightmug@gmail.com</p>
    <p><strong>Contact Number: 000-000-0000</strong></p>
  </footer>

  <script src="coffee.js"></script>
</body>
</html>

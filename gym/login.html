<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Fitness Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><img src="logo-mark.png" alt="">Fitness Club</a>
  <nav aria-label="Main">
    <ul class="nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#programs">Programs</a></li>
      <li><a href="index.html#schedule">Schedule</a></li>
      <li><a href="plan.html">My plan</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="pricing.html">Pricing</a></li>
      <li><a href="index.html#join">Join</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>
  <div class="actions">
    <a class="btn keep" href="tel:+000000000000">Call us</a>
  </div>
  <button class="menu-btn" aria-label="Open menu" aria-expanded="false"><span></span></button>
</header>

<main class="auth">
  <div class="auth-photo"><p>Your next session starts here</p></div>

  <div class="auth-panel">
    <h1>Welcome back</h1>
    <p>Log in to see your membership and book sessions.</p>

    <form class="auth-form" id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="toggle" aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>
      <div class="row">
        <label><input type="checkbox" name="remember"> Keep me logged in</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="btn solid" type="submit">Log in</button>
      <p id="msg" role="status" style="color:var(--shoe);font-weight:600;min-height:1.5rem"></p>
    </form>

    <p class="alt">Not a member yet? <a href="index.html#join">Join the club</a></p>
  </div>
</main>

<script>
  var pw = document.getElementById("password"), t = document.getElementById("toggle");
  t.addEventListener("click", function () {
    var show = pw.type === "password";
    pw.type = show ? "text" : "password";
    t.textContent = show ? "Hide" : "Show";
    t.setAttribute("aria-pressed", show);
  });

  // Demo only: checks the fields and shows a message. Replace with a real login request to your backend.
  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var msg = document.getElementById("msg"), em = document.getElementById("email");
    if (!em.value.includes("@")) { msg.textContent = "Enter a valid email address."; em.focus(); return; }
    if (pw.value.length < 6) { msg.textContent = "Password must be at least 6 characters."; pw.focus(); return; }
    msg.textContent = "Logging in...";
  });
</script>
<script src="script.js"></script>
</body>
</html>
